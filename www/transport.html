<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transport | Le Schema</title><link rel="stylesheet" href="classes.css"><link rel="stylesheet" href="common-theme.css"><link rel="stylesheet" href="transport.css"><link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="mobile-responsive.css?v=5"></head><body><header class="topbar"><a href="dashboard.html" class="back-link">← Tableau de bord</a><div class="brand"><img class="app-logo" src="logo.jpeg"> Etablissement Le Schema</div></header><main class="container"><section class="page-heading"><div><p class="eyebrow">TRANSPORT SCOLAIRE</p><h1>Gestion du transport</h1><p class="subtitle">Flotte, capacite, equipes et affectation des eleves.</p></div><button id="addBtn" class="primary-btn">+ Transport</button></section><section class="stats"><article class="stat-card"><span>Vehicules</span><strong id="vehicles">0</strong></article><article class="stat-card"><span>Capacite</span><strong id="capacityTotal">0</strong></article><article class="stat-card"><span>Eleves transport</span><strong id="studentTotal">0</strong></article><article class="stat-card"><span>Places restantes</span><strong id="remaining">0</strong></article></section><div id="alert" class="alert"></div><section class="panel"><div class="toolbar"><button id="autoBtn" class="primary-btn">Affectation automatique</button><button id="refreshBtn" class="secondary-btn">Actualiser</button></div><div id="message" class="message"></div><div id="cards" class="fleet"></div></section></main><dialog id="dialog"><form id="form"><div class="dialog-heading"><h2>Transport</h2><button id="closeBtn" type="button" class="close-btn">×</button></div><input id="id" type="hidden"><div class="form-grid"><label>Nom<input id="name" required></label><label>Immatriculation<input id="plate"></label><label>Type<select id="type"><option>Minibus</option><option>Autocar</option><option>Van</optio
